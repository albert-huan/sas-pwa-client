name: Release

# 发布流程：推送 v* tag（或在 Actions 里手动 workflow_dispatch）→ 构建并发布 Windows + Linux 产物。
#
# 【Linux 兼容性铁律】Linux 产物必须在 Ubuntu 22.04 上构建：
#   deb 里的二进制链接的是**构建机的 glibc**。在 24.04 / 26.04 上构建出的程序要求
#   GLIBC_2.39 / 2.43，拿到 Ubuntu 22.04（glibc 2.35）上会被动态链接器直接拒绝 ——
#   GUI 双击表现为「毫无反应」，终端运行才看得到 ``version `GLIBC_2.39' not found``。
#   所以 build-linux 固定 runs-on: ubuntu-22.04，并带两道校验（构建机 glibc、产物 glibc）。
#   本地构建走同一套约束：scripts/build-deb.sh（默认在 ubuntu:22.04 容器里构建）。
#   若将来 ubuntu-22.04 runner 被 GitHub 下线，改成在 ubuntu:22.04 容器里构建即可。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "覆盖要发布的 tag（留空则用当前 commit 创建草稿）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          # tagName / releaseName 使用触发的 tag；手动触发时用输入或当前短 SHA
          tagName: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseName: "SAS PWA Client ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            自动构建的 SAS PWA Client（SAS Viya 站点地址在客户端「设置」窗口里配置）。

            Windows：
            - `SAS.PWA.Client_x.y.z_x64_en-US.msi` / `..._x64-setup.exe`：安装包
            - `sas-pwa-client_windows_x64.exe`：便携版，下载即用

            Linux（Ubuntu 22.04 及以上）：
            - `SAS.PWA.Client_x.y.z_amd64.deb`（GitHub 下载后文件名里的空格会变成点），安装：
              `sudo apt install ./SAS*.deb`（Ubuntu 22.04 及以上）
            - 想看到报错就前台运行：`sas-pwa-client`；版本号显示在客户端「设置」窗口
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          # tauri-action 会自动执行 beforeBuildCommand (npm run build) 与 release 构建
          args: ""
          # 仅构建 release 产物（默认 true）
          includeRelease: true
          # 额外上传原始 exe 作为便携版（无需安装，直接运行）
          uploadPlainBinary: true

  build-linux:
    name: Build & Release (Linux)
    # 必须用 22.04，不能用 ubuntu-latest（=24.04）：
    # deb 里的二进制链接的是构建机的 glibc，24.04 构建出的程序要求 GLIBC_2.39，
    # 在 Ubuntu 22.04（glibc 2.35）上会直接被动态链接器拒绝 —— GUI 双击表现为「毫无反应」。
    # 按最老的受支持发行版构建，才能同时跑在 22.04 / 24.04 上。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri v2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # 构建前先卡住：构建机必须是 Ubuntu 22.04（glibc 2.35）。
      # deb 的可运行下限由构建机的 glibc 决定，用 24.04/26.04 构建出的包在 22.04 上
      # 会被动态链接器直接拒绝（GUI 双击毫无反应），必须在动手之前就失败，避免上传废包。
      - name: Assert 构建机 glibc = 2.35（Ubuntu 22.04）
        run: |
          set -euo pipefail
          uname -r
          GLIBC=$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+$')
          echo "构建机 glibc: $GLIBC"
          if [ "$GLIBC" != "2.35" ]; then
            echo "::error::构建机 glibc 是 $GLIBC，不是 Ubuntu 22.04 的 2.35；产物将无法在 22.04 上运行。请继续使用 ubuntu-22.04 runner（或改用 ubuntu:22.04 容器构建，见 scripts/build-deb.sh）。"
            exit 1
          fi

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tagName: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseName: "SAS PWA Client ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            自动构建的 SAS PWA Client（SAS Viya 站点地址在客户端「设置」窗口里配置）。

            Windows：
            - `SAS.PWA.Client_x.y.z_x64_en-US.msi` / `..._x64-setup.exe`：安装包
            - `sas-pwa-client_windows_x64.exe`：便携版，下载即用

            Linux（Ubuntu 22.04 及以上）：
            - `SAS.PWA.Client_x.y.z_amd64.deb`（GitHub 下载后文件名里的空格会变成点），安装：
              `sudo apt install ./SAS*.deb`（Ubuntu 22.04 及以上）
            - 想看到报错就前台运行：`sas-pwa-client`；版本号显示在客户端「设置」窗口
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          # 仅构建 deb：本机 Tauri CLI 的 --bundles 枚举被写成只接受 msi/nsis（Windows 目标），
          # 在 Linux 上直接传 --bundles deb 会被 clap 拒绝，故改用 --config 内联覆盖 targets。
          args: "--config {\"bundle\":{\"targets\":[\"deb\"]}}"
          includeRelease: true
          # Linux 不上传裸二进制，只上传 .deb 包
          uploadPlainBinary: false

      # 兜底校验：产物二进制的最高 GLIBC 符号需求不得高于 2.35。
      # tauri-action 此时已经把 deb 传到 Release 了，所以这里失败说明要手动删掉那个产物；
      # 正常情况下上面那条 Assert 应该更早就把问题拦住。
      - name: Verify 产物兼容 Ubuntu 22.04（glibc ≤ 2.35）
        run: |
          set -euo pipefail
          BIN=src-tauri/target/release/sas-pwa-client
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n1)
          echo "产物最高 GLIBC 符号需求：$MAX"
          LIMIT=2.35
          HIGHEST=$(printf '%s\n%s\n' "$LIMIT" "${MAX#GLIBC_}" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$LIMIT" ]; then
            echo "::error::产物需要 $MAX，高于 Ubuntu 22.04 的 glibc $LIMIT。"
            exit 1
          fi
          ls -lh src-tauri/target/release/bundle/deb/*.deb
